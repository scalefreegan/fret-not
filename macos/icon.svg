<?xml version="1.0" encoding="UTF-8"?>
<!-- Fret Not app icon: a rosewood guitar neck running diagonally across warm
     paper, brass frets and strings, one vermilion note dot, and a short run
     of piano keys in the lower corner, in the app's palette (web/src/index.css).
     Flat shapes only; sips rasterizes via CoreGraphics' basic SVG support, so
     no filters, no text. Rendered to icon-1024.png by render-icon.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile"><rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- paper -->
    <rect x="0" y="0" width="1024" height="1024" fill="#f4eee2"/>
    <!-- the neck, drawn flat then turned: low strings toward the bottom -->
    <g transform="translate(512 470) rotate(-38)">
      <rect x="-800" y="-176" width="1600" height="352" fill="#3f2519"/>
      <rect x="-800" y="-160" width="1600" height="320" fill="#5a3626"/>
      <!-- frets -->
      <g fill="#d9b25c">
        <rect x="-534" y="-160" width="26" height="320"/>
        <rect x="-264" y="-160" width="26" height="320"/>
        <rect x="-6" y="-160" width="26" height="320"/>
        <rect x="238" y="-160" width="26" height="320"/>
        <rect x="468" y="-160" width="26" height="320"/>
      </g>
      <!-- strings, thin to thick -->
      <g fill="#efe6cf">
        <rect x="-800" y="-116" width="1600" height="10"/>
        <rect x="-800" y="-44" width="1600" height="13"/>
        <rect x="-800" y="30" width="1600" height="16"/>
        <rect x="-800" y="104" width="1600" height="20"/>
      </g>
      <!-- the note -->
      <circle cx="-128" cy="-38" r="92" fill="#f4eee2"/>
      <circle cx="-128" cy="-38" r="74" fill="#c2410c"/>
    </g>
    <!-- piano keys, lower right -->
    <rect x="452" y="640" width="640" height="420" rx="40" ry="40" fill="#24201b"/>
    <g fill="#fffaf0">
      <rect x="478" y="666" width="150" height="400" rx="18" ry="18"/>
      <rect x="644" y="666" width="150" height="400" rx="18" ry="18"/>
      <rect x="810" y="666" width="150" height="400" rx="18" ry="18"/>
      <rect x="976" y="666" width="150" height="400" rx="18" ry="18"/>
    </g>
    <g fill="#24201b">
      <rect x="586" y="640" width="100" height="232" rx="14" ry="14"/>
      <rect x="752" y="640" width="100" height="232" rx="14" ry="14"/>
    </g>
  </g>
</svg>
