# The map of the whole curriculum: tracks, levels and the concepts mastery is
# tracked on. Lessons live in content/lessons/<track>/ and name the concepts
# they teach. Format: docs/CONTENT.md.

tracks:
  - id: core
    title: How music works
    summary: Sound, notes, rhythm, reading, scales, chords and harmony, independent of any one instrument.
  - id: piano
    title: Piano
    instrument: piano
    summary: The same ideas found, shaped and played on the keyboard.
  - id: guitar
    title: Guitar
    instrument: guitar
    summary: The same ideas found, shaped and played on the fretboard.

levels:
  - id: 0
    title: Sound
    summary: What a musical note physically is, and how a piano and a guitar make one.
  - id: 1
    title: Notes and layout
    summary: The twelve notes, their names, and where they live on the keyboard and the fretboard.
  - id: 2
    title: Rhythm and reading
    summary: How music is organised in time, and how to read it from the staff and from tab.
  - id: 3
    title: Intervals, scales and first chords
    summary: The distances between notes, the scales built from them, and the first chords on both instruments.
  - id: 4
    title: Keys and harmony
    status: outline
    summary: How chords belong to a key and lead to one another.
    topics:
      - The seven chords of a key and their Roman numerals
      - The circle of fifths as a map of keys and chords
      - Inversions and smooth voice leading
      - Cadences, and why V wants to go to I
  - id: 5
    title: Progressions and forms
    status: outline
    summary: The chord patterns most songs are made of.
    topics:
      - I–IV–V and I–V–vi–IV
      - The 12-bar blues and the blues scale
      - Barre chords and power chords
      - Verse, chorus, bridge and other song sections
  - id: 6
    title: Colour
    status: outline
    summary: Richer chords and scales.
    topics:
      - Seventh chords
      - ii–V–I
      - Swing rhythm
      - The modes
      - Extensions (ninths, elevenths, thirteenths)
  - id: 7
    title: Composition
    status: outline
    summary: Writing your own music.
    topics:
      - Writing a melody over chords
      - Harmonising a melody
      - Bass lines
      - Form and development
      - Arranging for piano and guitar

concepts:
  # ---- Level 0: Sound ------------------------------------------------------
  - { id: vibration, title: Sound is vibration, level: 0 }
  - { id: pitch-frequency, title: Pitch is frequency, level: 0, requires: [vibration] }
  - { id: loudness-amplitude, title: Loudness is amplitude, level: 0, requires: [vibration] }
  - { id: string-modes, title: How a string vibrates, level: 0, requires: [pitch-frequency] }
  - { id: overtone-series, title: The overtone series, level: 0, requires: [string-modes] }
  - { id: timbre, title: Timbre, level: 0, requires: [overtone-series] }
  - { id: octave, title: The octave, level: 0, requires: [pitch-frequency] }
  - { id: consonance, title: Why some notes sound good together, level: 0, requires: [overtone-series, octave] }
  - { id: piano-sound, title: How a piano makes sound, level: 0, track: piano, requires: [string-modes] }
  - { id: guitar-sound, title: How a guitar makes sound, level: 0, track: guitar, requires: [string-modes] }

